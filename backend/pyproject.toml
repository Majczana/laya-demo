[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-emoji-demo-backend"
version = "0.1.0"
description = "Local API for the LAYA emoji decision demo"
requires-python = ">=3.10"
dependencies = [
  "laya[serve]==0.3.20",
  "pydantic>=2.9,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
