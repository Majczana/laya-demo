[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-arcade-backend"
version = "0.1.0"
description = "Local API for the LAYA decision demos"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.28,<1",
  "laya[serve]==0.3.20",
  "pydantic>=2.9,<3",
  "pypdf>=6,<7",
  "python-docx>=1.2,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
